id: SX-WEB-001
title: Suspicious Web Attack Pattern
description: Detect common SQL injection and script injection markers in web request data.
severity: high
enabled: true
logsource:
  product: web
  service: http
detection:
  selection:
    message|contains:
      - "UNION SELECT"
      - "<script"
      - "../etc/passwd"
  condition: selection
tags:
  - attack.initial_access
  - attack.t1190
