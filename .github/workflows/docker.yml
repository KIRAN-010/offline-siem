name: SentinelX Docker Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build SentinelX images
        run: docker compose build --no-cache
      - name: Start SentinelX
        run: docker compose up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Verify frontend proxy
        run: |
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/api/v1
      - name: Stop SentinelX
        if: always()
        run: docker compose down -v
