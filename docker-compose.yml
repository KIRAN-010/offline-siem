services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelx-backend
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
    volumes:
      - sentinelx_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-console
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  sentinelx_data:
